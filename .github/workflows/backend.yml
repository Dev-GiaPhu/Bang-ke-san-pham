name: Deploy Firebase backend
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firebase.json'
      - '.github/workflows/backend.yml'
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Prepare Firebase credentials
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GP_STATISTICAL_PUBLIC }}
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          chmod 600 "$RUNNER_TEMP/firebase-service-account.json"
          node -e "const x=require(process.env.RUNNER_TEMP+'/firebase-service-account.json'); console.log('Service account:',x.client_email); console.log('Project ID:',x.project_id); if(x.client_email!=='firebase-adminsdk-fbsvc@gp-statistical-public.iam.gserviceaccount.com'||x.project_id!=='gp-statistical-public') process.exit(2)"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"
      - name: Write Functions environment
        shell: bash
        env:
          GMAIL_SMTP_USER: ${{ secrets.GMAIL_SMTP_USER }}
          GMAIL_SMTP_APP_PASSWORD: ${{ secrets.GMAIL_SMTP_APP_PASSWORD }}
          GMAIL_SMTP_FROM: ${{ secrets.GMAIL_SMTP_FROM }}
          GOOGLE_DRIVE_API_KEY: ${{ secrets.GOOGLE_DRIVE_API_KEY }}
        run: |
          test -n "$GMAIL_SMTP_USER"
          test -n "$GMAIL_SMTP_APP_PASSWORD"
          test -n "$GOOGLE_DRIVE_API_KEY"
          {
            printf 'GMAIL_SMTP_USER=%s\n' "$GMAIL_SMTP_USER"
            printf 'GMAIL_SMTP_APP_PASSWORD=%s\n' "$GMAIL_SMTP_APP_PASSWORD"
            printf 'GMAIL_SMTP_FROM=%s\n' "${GMAIL_SMTP_FROM:-$GMAIL_SMTP_USER}"
            printf 'GOOGLE_DRIVE_API_KEY=%s\n' "$GOOGLE_DRIVE_API_KEY"
          } > functions/.env
      - name: Install Functions dependencies
        working-directory: functions
        run: npm install --omit=dev
      - name: Deploy Firebase Functions only
        run: firebase deploy --project gp-statistical-public --only functions --non-interactive
      - name: Remove temporary secrets
        if: always()
        run: rm -f functions/.env "$RUNNER_TEMP/firebase-service-account.json"
