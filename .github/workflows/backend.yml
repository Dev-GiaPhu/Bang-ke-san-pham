name: Deploy Firebase backend
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firebase.json'
      - '.github/workflows/backend.yml'
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Prepare Functions environment
        shell: bash
        env:
          GMAIL_SMTP_USER: ${{ secrets.GMAIL_SMTP_USER }}
          GMAIL_SMTP_APP_PASSWORD: ${{ secrets.GMAIL_SMTP_APP_PASSWORD }}
          GMAIL_SMTP_FROM: ${{ secrets.GMAIL_SMTP_FROM }}
          GOOGLE_DRIVE_API_KEY: ${{ secrets.GOOGLE_DRIVE_API_KEY }}
        run: |
          test -n "$GMAIL_SMTP_USER"
          test -n "$GMAIL_SMTP_APP_PASSWORD"
          test -n "$GOOGLE_DRIVE_API_KEY"
          {
            printf 'GMAIL_SMTP_USER=%s\n' "$GMAIL_SMTP_USER"
            printf 'GMAIL_SMTP_APP_PASSWORD=%s\n' "$GMAIL_SMTP_APP_PASSWORD"
            printf 'GMAIL_SMTP_FROM=%s\n' "${GMAIL_SMTP_FROM:-$GMAIL_SMTP_USER}"
            printf 'GOOGLE_DRIVE_API_KEY=%s\n' "$GOOGLE_DRIVE_API_KEY"
          } > functions/.env

      - name: Install Functions dependencies
        working-directory: functions
        run: npm install --omit=dev

      - name: Verify Firebase CLI authentication
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          test -n "$FIREBASE_TOKEN"
          firebase projects:list --token "$FIREBASE_TOKEN" --json > /tmp/firebase-projects.json
          node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('/tmp/firebase-projects.json','utf8')); const ok=(x.result||[]).some(p=>p.projectId==='gp-statistical-public'); if(!ok){console.error('Firebase token cannot access gp-statistical-public'); process.exit(2)} console.log('Firebase CLI authentication OK for gp-statistical-public')"

      - name: Deploy Firebase Functions
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: firebase deploy --project gp-statistical-public --only functions --non-interactive --token "$FIREBASE_TOKEN"

      - name: Remove temporary secrets
        if: always()
        run: rm -f functions/.env /tmp/firebase-projects.json
