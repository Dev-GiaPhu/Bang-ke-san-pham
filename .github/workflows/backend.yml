name: Deploy Firebase backend
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firestore.rules'
      - 'firebase.json'
      - '.github/workflows/backend.yml'
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Write service account
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GP_STATISTICAL_PUBLIC }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          chmod 600 "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"
      - name: Verify service account identity
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const p = process.env.RUNNER_TEMP + '/firebase-service-account.json';
          const j = JSON.parse(fs.readFileSync(p, 'utf8'));
          const expectedEmail = 'firebase-adminsdk-fbsvc@gp-statistical-public.iam.gserviceaccount.com';
          const expectedProject = 'gp-statistical-public';
          if (j.client_email !== expectedEmail) {
            console.error(`Service account mismatch. Expected ${expectedEmail}, got ${j.client_email || '(missing)'}`);
            process.exit(1);
          }
          if (j.project_id !== expectedProject) {
            console.error(`Project mismatch. Expected ${expectedProject}, got ${j.project_id || '(missing)'}`);
            process.exit(1);
          }
          console.log(`Using service account: ${j.client_email}`);
          console.log(`Project: ${j.project_id}`);
          NODE
      - name: Write Functions environment
        shell: bash
        env:
          GMAIL_SMTP_USER: ${{ secrets.GMAIL_SMTP_USER }}
          GMAIL_SMTP_APP_PASSWORD: ${{ secrets.GMAIL_SMTP_APP_PASSWORD }}
          GMAIL_SMTP_FROM: ${{ secrets.GMAIL_SMTP_FROM }}
          GOOGLE_DRIVE_API_KEY: ${{ secrets.GOOGLE_DRIVE_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$GMAIL_SMTP_USER"
          test -n "$GMAIL_SMTP_APP_PASSWORD"
          test -n "$GOOGLE_DRIVE_API_KEY"
          {
            printf 'GMAIL_SMTP_USER=%s\n' "$GMAIL_SMTP_USER"
            printf 'GMAIL_SMTP_APP_PASSWORD=%s\n' "$GMAIL_SMTP_APP_PASSWORD"
            printf 'GMAIL_SMTP_FROM=%s\n' "${GMAIL_SMTP_FROM:-$GMAIL_SMTP_USER}"
            printf 'GOOGLE_DRIVE_API_KEY=%s\n' "$GOOGLE_DRIVE_API_KEY"
          } > functions/.env
      - name: Deploy functions and rules
        run: firebase deploy --project gp-statistical-public --only functions,firestore:rules --non-interactive
      - name: Remove temporary secrets
        if: always()
        run: rm -f functions/.env "$RUNNER_TEMP/firebase-service-account.json"
