name: Validate GP Statistical

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          set -e
          for f in src/firebase-init.js src/production-suite.js src/permission-mail.js src/production-runtime.js src/share-guard.js; do
            node --check "$f"
          done
      - name: Check required entrypoints
        run: |
          test -s index.html
          test -s firestore.rules
          grep -q "production-suite.js" index.html
          grep -q "firebase-init.js" index.html
      - name: Check Firebase configuration consistency
        run: |
          grep -q "gp-statistical" src/firebase-init.js
          grep -q "gp-statistical" src/production-suite.js
