name: Validate GP Statistical

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          set -e
          node --check src/gp-app-stable.js
          node --check src/runtime-fixes-v2.js
      - name: Check required entrypoints
        run: |
          set -e
          test -s index.html
          test -s src/gp-app-stable.js
          test -s src/runtime-fixes-v2.js
          test -s src/gp.css
          test -s src/gp-ui-fixes.css
          test -s firestore.rules
          grep -q 'src/gp-app-stable.js' src/boot-repair.mjs || true
          grep -q 'src/gp.css' index.html
          grep -q 'src/runtime-fixes-v2.js' index.html
          grep -q 'src/gp-ui-fixes.css' index.html
          ! grep -q 'bootstrap.js' index.html
          ! grep -q 'production-suite.js' index.html
          ! grep -q 'production-hotfix.js' index.html
      - name: Check Firebase configuration
        run: |
          set -e
          grep -q 'gp-statistical' src/gp-app-stable.js
          grep -q 'gp-statistical.firebaseapp.com' src/gp-app-stable.js
      - name: Check OAuth client consistency
        run: |
          set -e
          grep -q '763681707769-62cc0421i7fuvqo27vbh94e6ql5otuk1.apps.googleusercontent.com' src/gp-app-stable.js
          grep -q '763681707769-62cc0421i7fuvqo27vbh94e6ql5otuk1.apps.googleusercontent.com' src/oauth-runtime.js
          grep -q '763681707769-62cc0421i7fuvqo27vbh94e6ql5otuk1.apps.googleusercontent.com' src/runtime-fixes-v2.js
      - name: Check Firestore rules
        run: |
          set -e
          grep -q "rules_version = '2'" firestore.rules
          grep -q 'workspaces' firestore.rules
          grep -q 'shares' firestore.rules
          grep -q 'invites' firestore.rules
      - name: Check for private key material
        run: |
          ! grep -R -nE 'BEGIN (RSA|OPENSSH) PRIVATE KEY|private_key' --include='*.js' --include='*.html' --include='*.json' .
