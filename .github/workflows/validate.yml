name: Validate GP Statistical

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          set -e
          node --check src/gp-app-final.js
      - name: Check HTML and required entrypoints
        run: |
          set -e
          test -s index.html
          test -s firestore.rules
          grep -q 'src/gp-app-final.js' index.html
          grep -q 'src/gp.css' index.html
          ! grep -q 'bootstrap.js' index.html
          ! grep -q 'production-suite.js' index.html
      - name: Check Firebase configuration consistency
        run: |
          set -e
          grep -q 'gp-statistical' src/gp-app-final.js
          grep -q 'gp-statistical.firebaseapp.com' src/gp-app-final.js
          grep -q 'gp-statistical' firestore.rules
      - name: Check forbidden frontend secrets
        run: |
          set -e
          ! grep -R -nE 'BEGIN (RSA|OPENSSH) PRIVATE KEY|private_key|client_secret' --include='*.js' --include='*.html' --include='*.json' . || true
