name: Final GP Statistical repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'Final GP Statistical repair [skip ci]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply production fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/production-suite.js')
          s = p.read_text(encoding='utf-8')

          s = s.replace(
              "const state = {user:null, member:null, members:[], role:null, records:[], settings:{...defaults,...loadLocal(SETTINGS,{})}, driveToken:null, workspaceSettings:{}, shareId:'', share:null, shareRecords:[], shareSearch:'', booted:false};\nlet stopProducts=null, stopMembers=null, stopShare=null, silentTried=false;",
              "const state = {user:null, member:null, members:[], role:null, records:[], settings:{...defaults,...loadLocal(SETTINGS,{})}, driveToken:null, workspaceSettings:{}, shareId:'', share:null, shareRecords:[], shareSearch:'', booted:false, _deletedShares:new Set()};\nconst DRIVE_SESSION='gp-drive-token-v1';\nlet stopProducts=null, stopMembers=null, stopShare=null, silentTried=false;"
          )

          s = re.sub(
              r"async function silentDriveRestore\(\)\{.*?\}\nasync function driveFetch",
              """async function silentDriveRestore(){if(silentTried||!canDrive())return;silentTried=true;try{const saved=sessionStorage.getItem(DRIVE_SESSION);if(!saved)return;const r=await fetch('https://www.googleapis.com/drive/v3/about?fields=user',{headers:{Authorization:`Bearer ${saved}`}});if(r.ok){state.driveToken=saved;return}}catch{}sessionStorage.removeItem(DRIVE_SESSION);}\nasync function driveFetch""",
              s,
              count=1,
              flags=re.S
          )

          s = s.replace(
              "callback:r=>r?.access_token?resolve(r.access_token):reject(Error(r?.error_description||r?.error||'Không thể kết nối Google Drive'))",
              "callback:r=>{if(r?.access_token){try{sessionStorage.setItem(DRIVE_SESSION,r.access_token)}catch{};resolve(r.access_token)}else reject(Error(r?.error_description||r?.error||'Không thể kết nối Google Drive'))}"
          )
          s = s.replace(
              "if(r.status===401){state.driveToken=null;throw Error('Kết nối Google Drive đã hết hạn. Hãy bấm Kết nối Google Drive.')}"
              ,"if(r.status===401){state.driveToken=null;try{sessionStorage.removeItem(DRIVE_SESSION)}catch{};throw Error('Kết nối Google Drive đã hết hạn. Hãy bấm Kết nối Google Drive.')}")

          def replace_fn(text, start_marker, end_marker, new_fn):
              a=text.index(start_marker)
              b=text.index(end_marker,a)
              return text[:a]+new_fn+text[b:]

          new_stats = r'''function statsMarkup(data){const s=summary(data);const types=Object.entries(s.counts).filter(([,n])=>n);return `<section class="grid gp-stats"><div class="stat card stat-products"><span>TỔNG SỐ SẢN PHẨM</span><b>${s.products}</b>${types.length?`<div class="stat-breakdown">${types.map(([k,n])=>`<div class="stat-breakdown-row"><span>${esc(k)}</span><b>${n}</b></div>`).join('')}</div>`:''}</div><div class="stat card"><span>TỔNG SỐ LƯỢNG</span><b>${s.qty}</b></div><div class="stat card"><span>KHÁCH HÀNG</span><b>${new Set(data.map(r=>r.customer).filter(Boolean)).size}</b></div><div class="stat card"><span>NGƯỜI THỰC HIỆN</span><b>${new Set(data.map(r=>r.designer).filter(Boolean)).size}</b></div></section>}'''
          s=replace_fn(s,'function statsMarkup(data){','function thumbSrc',new_stats+'\n')

          new_edit = r'''function editModal(record){const w=document.createElement('div');w.className='modal-backdrop';const defs=[...(state.settings.editTypes||[])];if(!defs.some(x=>norm(x)==='khac'))defs.push('Khác');const monthRaw=String(record.month||'');const dateRaw=String(record.date||'');const m=monthRaw.match(/^(\d{4})-(\d{2})$/);const parsedDate=dateRaw.match(/^(\d{4})-(\d{2})-(\d{2})$/);const monthDisplay=m?`${m[2]}/${m[1]}`:(parsedDate?`${parsedDate[2]}/${parsedDate[1]}`:'');const dayDisplay=parsedDate?parsedDate[3]:'';const existingOther=(record.editTypes||[]).find(x=>x.startsWith('Khác:'));const checkDefs=defs.map((x,i)=>`<label class="check"><input type="checkbox" data-gp-et="${i}" ${x==='Khác'?(existingOther?'checked':''):(record.editTypes||[]).includes(x)?'checked':''}><span>${esc(x)}</span></label>`).join('');w.innerHTML=`<div class="modal large"><div class="modal-head"><div><h2>Sửa thông tin sản phẩm</h2><div class="muted">Thông tin này chỉ cập nhật bảng kê; file trong Google Drive không bị thay đổi.</div></div><button class="btn" data-close>Đóng</button></div><div class="form-grid"><label class="field"><label>Khách hàng</label><input id="ef-c" class="input" value="${esc(record.customer||'')}"></label><label class="field"><label>Tháng</label><input id="ef-month-display" class="input" inputmode="numeric" placeholder="MM/YYYY" value="${esc(monthDisplay)}"><input id="ef-m" type="hidden" value="${esc(monthRaw)}"></label><label class="field"><label>Ngày</label><input id="ef-day-display" class="input" inputmode="numeric" maxlength="2" placeholder="DD" value="${esc(dayDisplay)}"><input id="ef-dt" type="hidden" value="${esc(dateRaw)}"></label><label class="field"><label>Số lượng</label><input id="ef-q" class="input" type="number" min="0" step="1" value="${esc(record.quantity??1)}"></label><label class="field"><label>Tên sản phẩm</label><input id="ef-p" class="input" value="${esc(record.productName||'')}"></label><label class="field"><label>Thể tích</label><input id="ef-v" class="input" value="${esc(record.volume||'')}"></label><label class="field"><label>Kích thước</label><input id="ef-s" class="input" value="${esc(record.size||'')}"></label><label class="field"><label>Người thực hiện</label><input id="ef-user" class="input" list="gp-designer-list" value="${esc(record.designer||'')}" placeholder="Chọn hoặc nhập tên"><datalist id="gp-designer-list">${(state.settings.designers||[]).map(x=>`<option value="${esc(x)}"></option>`).join('')}</datalist></label></div><label class="field"><label>Loại công việc</label><div class="check-grid">${checkDefs}</div><div id="gp-other-wrap" class="other-work" ${existingOther?'':'hidden'}><label>Chi tiết công việc khác</label><input id="gp-other-text" class="input" value="${esc(existingOther?existingOther.slice(5).trim():'')}" placeholder="Nhập nội dung…"></div></label><div class="actions" style="justify-content:flex-end;margin-top:18px"><button class="btn" data-close>Hủy</button><button class="btn primary" id="ef-save">Lưu thay đổi</button></div></div>`;document.body.appendChild(w);const syncDate=()=>{const md=w.querySelector('#ef-month-display').value.trim();const dm=w.querySelector('#ef-day-display').value.trim();const mm=md.match(/^(\d{1,2})\/(\d{4})$/);const day=String(dm).padStart(2,'0');if(mm&&Number(mm[1])>=1&&Number(mm[1])<=12){const month=String(mm[1]).padStart(2,'0');w.querySelector('#ef-m').value=`${mm[2]}-${month}`;w.querySelector('#ef-dt').value=/^\d{2}$/.test(day)?`${mm[2]}-${month}-${day}`:''}else{w.querySelector('#ef-m').value='';w.querySelector('#ef-dt').value=''}};w.querySelector('#ef-month-display').addEventListener('input',syncDate);w.querySelector('#ef-day-display').addEventListener('input',e=>{e.target.value=e.target.value.replace(/\D/g,'').slice(0,2);syncDate()});w.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>w.remove());const otherIndex=defs.findIndex(x=>x==='Khác');w.querySelectorAll('[data-gp-et]').forEach(b=>b.onchange=()=>{if(Number(b.dataset.gpEt)===otherIndex)w.querySelector('#gp-other-wrap').hidden=!b.checked});w.querySelector('#ef-save').onclick=async()=>{try{syncDate();const month=w.querySelector('#ef-m').value;const date=w.querySelector('#ef-dt').value;const selected=[...w.querySelectorAll('[data-gp-et]:checked')].map(x=>defs[Number(x.dataset.gpEt)]).filter(Boolean);if(selected.includes('Khác')){const detail=w.querySelector('#gp-other-text').value.trim();if(!detail)throw Error('Hãy nhập chi tiết cho công việc khác.');selected.splice(selected.indexOf('Khác'),1,`Khác: ${detail}`)}const next={...record,customer:w.querySelector('#ef-c').value.trim(),month,date,quantity:Math.max(0,Number(w.querySelector('#ef-q').value)||0),productName:w.querySelector('#ef-p').value.trim(),volume:w.querySelector('#ef-v').value.trim(),size:w.querySelector('#ef-s').value.trim(),designer:w.querySelector('#ef-user').value.trim(),editTypes:selected};await saveProduct(next);w.remove();toast('Đã lưu thay đổi')}catch(e){toast(e.message||String(e))}}}'''
          s=replace_fn(s,'function editModal(record){','async function saveProduct',new_edit+'\n')

          new_share = r'''async function loadShareManager(){const box=document.querySelector('#gp-shares');if(!box)return;try{const qs=await getDocs(query(collection(db,'workspaces',W,'shares'),orderBy('createdAt','desc')));box.innerHTML=qs.docs.filter(d=>!state._deletedShares.has(d.id)).map(d=>{const x=d.data(),url=`${location.origin}${location.pathname}#share=${d.id}`;return `<div class="share-row" data-share-row="${d.id}"><div><strong>${esc(x.name||'GP Statistical')}</strong><div class="share-url">${esc(url)}</div><small>${x.active?'Đang hoạt động':'Đang ẩn'} · ${x.permission==='editor'?'Có thể chỉnh sửa':'Chỉ xem'}</small></div><div class="share-actions">${canManage()?`<select class="select small-select" data-share-perm="${d.id}"><option value="viewer" ${x.permission!=='editor'?'selected':''}>Chỉ xem</option><option value="editor" ${x.permission==='editor'?'selected':''}>Có thể chỉnh sửa</option></select><button class="btn small" data-share-active="${d.id}">${x.active?'Tạm ẩn':'Hiện lại'}</button><button class="btn small" data-share-copy="${d.id}">Sao chép</button><button class="btn small danger" data-share-delete="${d.id}">Xóa</button>`:'<button class="btn small" data-share-copy="'+d.id+'">Sao chép</button>'}</div></div>`}).join('')||'<div class="empty">Chưa có liên kết.</div>';box.querySelectorAll('[data-share-perm]').forEach(s=>s.onchange=()=>updateShare(s.dataset.sharePerm,{permission:s.value}));box.querySelectorAll('[data-share-active]').forEach(b=>b.onclick=()=>updateShare(b.dataset.shareActive,{active:b.textContent.includes('Hiện')}));box.querySelectorAll('[data-share-copy]').forEach(b=>b.onclick=()=>navigator.clipboard?.writeText(`${location.origin}${location.pathname}#share=${b.dataset.shareCopy}`).then(()=>toast('Đã sao chép liên kết')));box.querySelectorAll('[data-share-delete]').forEach(b=>b.onclick=async()=>{const id=b.dataset.shareDelete;state._deletedShares.add(id);document.querySelector(`[data-share-row="${CSS.escape(id)}"]`)?.remove();try{await deleteSharePermanently(id)}catch(e){state._deletedShares.delete(id);await loadShareManager();toast(e.message||String(e))}})}'''
          s=replace_fn(s,'async function loadShareManager(){','async function loadMembersManager',new_share+'\n')

          new_settings = r'''function settingsMarkup(){const showDrive=canDrive();return `<section class="card"><div class="section-head"><div><h2>Tài khoản</h2><span class="muted">${esc(state.user.email)}</span></div></div><p class="field-help">Quyền hiện tại: <b>${esc(state.role||'')}</b></p></section>${showDrive?`<section class="card"><h2>Google Drive</h2><p class="field-help">${canManage()?'Bạn là người quản lý. Mã kết nối chỉ hiển thị cho người quản lý.':'Bạn được cấp quyền sử dụng Google Drive. Hãy kết nối bằng chính tài khoản Google đang đăng nhập.'}</p><div class="actions">${canManage()?`<input id="gp-client" class="input wide" value="${esc(state.settings.googleClientId||state.workspaceSettings.googleClientId||'')}" placeholder="Mã ứng dụng Google Drive"><button class="btn primary" id="gp-save-client">Lưu</button>`:''}<button class="btn" id="gp-test-drive">${state.driveToken?'✓ Google Drive đã kết nối':'Kết nối Google Drive'}</button></div></section>`:''}${canManage()?`<div class="settings-grid"><section class="card"><h2>Khách hàng</h2><div class="filters"><input id="gp-new-customer" class="input" placeholder="Tên khách hàng"><button class="btn primary" id="gp-add-customer">Thêm</button></div><div class="pill-list">${state.settings.customers.map((x,i)=>`<span class="pill">${esc(x)} <button data-rmc="${i}">×</button></span>`).join('')||'—'}</div></section><section class="card"><h2>Người thực hiện</h2><div class="filters"><input id="gp-new-designer" class="input" placeholder="Tên"><button class="btn primary" id="gp-add-designer">Thêm</button></div><div class="pill-list">${state.settings.designers.map((x,i)=>`<span class="pill">${esc(x)} <button data-rmd="${i}">×</button></span>`).join('')}</div></section></div>`:''}`}'''
          s=replace_fn(s,'function settingsMarkup(){','function shareAdminMarkup',new_settings+'\n')

          # Replace invitation provisioning with a raw-email document plus encoded backward compatibility.
          new_invite = r'''async function inviteMember(){if(!canInvite())return;const email=document.querySelector('#gp-invite-email')?.value.trim().toLowerCase();if(!email||!email.includes('@'))return toast('Nhập đúng địa chỉ Gmail.');const {role,canInvite,driveAccess}=inviteFormDefaults();const payload={email,role,canInvite,driveAccess,workspaceId:W,createdBy:state.user.uid,createdAt:serverTimestamp(),updatedAt:serverTimestamp()};try{await setDoc(doc(db,'workspaces',W,'invites',email),payload,{merge:true});await setDoc(doc(db,'workspaces',W,'invites',emailKey(email)),payload,{merge:true});const appUrl=`${location.origin}${location.pathname}`;await addDoc(collection(db,'mail'),{to:email,workspaceId:W,inviteEmail:email,createdBy:state.user.uid,createdAt:serverTimestamp(),message:{subject:'Lời mời tham gia GP Statistical',text:`Bạn được mời tham gia GP Statistical với quyền ${role==='editor'?'Có thể chỉnh sửa':'Chỉ xem'}. Mở: ${appUrl}`,html:`<div style="font-family:Arial,sans-serif;max-width:620px;margin:auto;padding:32px;color:#142033"><div style="font-size:12px;font-weight:800;letter-spacing:3px;color:#ef6b3b">GP STATISTICAL</div><h1 style="font-size:34px;margin:18px 0 8px">Bạn được mời tham gia</h1><p>Bạn được cấp quyền <b>${role==='editor'?'Có thể chỉnh sửa':'Chỉ xem'}</b>.</p><p style="margin:24px 0"><a href="${esc(appUrl)}" style="display:inline-block;background:#ef6b3b;color:#fff;text-decoration:none;padding:13px 20px;border-radius:10px;font-weight:700">Mở GP Statistical</a></p></div>`}});toast(`Đã cấp quyền cho ${email}.`);document.querySelector('#gp-invite-email').value='';loadMembersManager()}catch(e){toast(e.message||String(e))}}'''
          s=replace_fn(s,'async function inviteMember(){','function inviteFormDefaults',new_invite+'\n')

          # Make invited accounts resolve from both canonical email and the older encoded key.
          old_segment = "const inv=await getDoc(doc(db,'workspaces',W,'invites',emailKey((u.email||'').toLowerCase())));if(inv.exists()&&String(inv.data().email||'').toLowerCase()===(u.email||'').toLowerCase()){const x=inv.data();"
          new_segment = "const email=(u.email||'').toLowerCase();let inv=await getDoc(doc(db,'workspaces',W,'invites',email));if(!inv.exists())inv=await getDoc(doc(db,'workspaces',W,'invites',emailKey(email)));if(inv.exists()&&String(inv.data().email||'').toLowerCase()===email){const x=inv.data();"
          s=s.replace(old_segment,new_segment)

          p.write_text(s,encoding='utf-8')

          css=Path('src/production-ui.css')
          c=css.read_text(encoding='utf-8')
          c += "\n/* final repair */\n.stat-products .stat-breakdown{margin-top:14px;padding-top:11px;border-top:1px solid var(--line);display:grid;gap:8px}.stat-breakdown-row{display:flex;justify-content:space-between;gap:18px;align-items:center;font-size:12px;color:var(--muted)}.stat-breakdown-row b{color:var(--ink);font-size:13px}.other-work{margin-top:10px;padding:12px;border:1px dashed var(--line);border-radius:12px;background:var(--surface-2)}.other-work[hidden]{display:none}.modal.large{width:min(1100px,94vw)}.modal.large .form-grid{grid-template-columns:repeat(4,minmax(0,1fr))}@media(max-width:900px){.modal.large .form-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){.modal.large .form-grid{grid-template-columns:1fr}.share-actions,.member-controls{width:100%}}"
          css.write_text(c,encoding='utf-8')

          idx=Path('index.html')
          h=idx.read_text(encoding='utf-8').replace('20260908-34','20260908-36').replace('20260908-35','20260908-36')
          idx.write_text(h,encoding='utf-8')
          PY
      - name: Validate source
        run: |
          set -e
          node --check src/firebase-init.js
          node --check src/bootstrap.js
          node --check src/production-suite.js
          node --check src/permission-mail.js
          node --check src/production-runtime.js
          test -s firestore.rules
          grep -q "bootstrap.js" index.html
          grep -q "production-suite.js" src/bootstrap.js
          grep -q "firebase-init.js" src/bootstrap.js
      - name: Self remove repair workflow and commit
        run: |
          rm -f .github/workflows/one-time-final-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/production-suite.js src/production-ui.css index.html .github/workflows/one-time-final-repair.yml
          git commit -m 'Final GP Statistical repair [skip ci]'
          git push
